syntax = "proto3";
package cash.z.wallet.sdk.rpc;
import "compact_formats.proto";

message BlockID { uint64 height = 1; bytes hash = 2; }
message BlockRange { BlockID start = 1; BlockID end = 2; }
message ChainSpec {}
message Empty {}
message TxFilter { BlockID block = 1; uint64 index = 2; bytes hash = 3; }
message RawTransaction { bytes data = 1; uint64 height = 2; }
message SendResponse { int32 errorCode = 1; string errorMessage = 2; }
message LightdInfo {
  string version = 1; string vendor = 2; bool taddrSupport = 3;
  string chainName = 4; uint64 saplingActivationHeight = 5;
  string consensusBranchId = 6; uint64 blockHeight = 7;
  string gitCommit = 8; string branch = 9; string buildDate = 10;
  string buildUser = 11; uint64 estimatedHeight = 12;
  string zcashdBuild = 13; string zcashdSubversion = 14;
  string donationAddress = 15; string upgradeName = 16;
  uint64 upgradeHeight = 17; string lightwalletProtocolVersion = 18;
}
service CompactTxStreamer {
  rpc GetLatestBlock(ChainSpec) returns (BlockID);
  rpc GetBlock(BlockID) returns (CompactBlock);
  rpc GetBlockRange(BlockRange) returns (stream CompactBlock);
  rpc GetTransaction(TxFilter) returns (RawTransaction);
  rpc SendTransaction(RawTransaction) returns (SendResponse);
  rpc GetLightdInfo(Empty) returns (LightdInfo);
}
